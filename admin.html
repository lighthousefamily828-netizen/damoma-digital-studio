<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovelVerse Admin</title><link rel="stylesheet" href="styles.css"><style>body{background:#f7f5f1}.admin{max-width:1100px;margin:auto;padding:28px 18px}.panel{background:#fff;border:1px solid #e7e2dc;border-radius:18px;padding:22px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel input,.panel textarea,.panel select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font:inherit;box-sizing:border-box}.panel textarea{min-height:180px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.primary-btn{background:#111;color:#fff}.secondary-btn{background:#eee;color:#111}.danger-btn{background:#a33;color:#fff}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #eee;padding:14px;border-radius:12px}.row small{display:block;color:#777}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.status{margin-top:10px}.topbar nav{display:flex;gap:12px;align-items:center}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>Novel<span>Verse</span></span></a><nav><a href="index.html">View site</a><button id="logout" class="ghost">Logout</button></nav></header><main class="admin"><section id="gate" class="panel"><h1>Admin access</h1><p id="gateMsg">Checking your account…</p><a href="index.html#account" class="btn primary-btn">Sign in</a></section><div id="dashboard" class="hidden"><h1>NovelVerse Admin</h1><p>Create and manage novels and chapters.</p><section class="panel"><h2>Add / edit novel</h2><form id="novelForm" class="form-grid"><input type="hidden" id="novelId"><input id="title" placeholder="Novel title" required><input id="author" placeholder="Author name" required><input id="slug" placeholder="Slug" required><select id="status"><option value="ongoing">Ongoing</option><option value="completed">Completed</option><option value="hiatus">Hiatus</option></select><input id="cover" placeholder="Cover image URL"><select id="genre" multiple size="5"></select><textarea id="description" class="full" placeholder="Novel description"></textarea><label><input id="featured" type="checkbox"> Featured</label><label><input id="published" type="checkbox"> Published</label><div class="full actions"><button class="btn primary-btn" type="submit">Save novel</button><button class="btn secondary-btn" type="button" id="resetNovel">Clear</button></div><p id="novelMsg" class="full status"></p></form></section><section class="panel"><h2>Novels</h2><div id="novelList" class="list">Loading…</div></section><section id="chapterPanel" class="panel hidden"><h2 id="chapterHeading">Add chapter</h2><form id="chapterForm" class="form-grid"><input type="hidden" id="chapterId"><input type="hidden" id="chapterNovelId"><input id="chapterNumber" type="number" min="1" placeholder="Chapter number" required><input id="chapterTitle" placeholder="Chapter title" required><textarea id="chapterContent" class="full" placeholder="Write chapter content here…" required></textarea><label><input id="chapterPublished" type="checkbox"> Published</label><div class="full actions"><button class="btn primary-btn" type="submit">Save chapter</button><button class="btn secondary-btn" type="button" id="resetChapter">Clear</button></div><p id="chapterMsg" class="full status"></p></form><div id="chapterList" class="list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="novel-admin.js"></script></body></html>
