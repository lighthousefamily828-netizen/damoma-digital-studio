<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INKORA Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><a href="novel.html" class="brand"><span>I</span> INKORA</a><div><a href="novel.html">View site</a><button id="logout">Sign out</button></div></header><main class="wrap"><div id="gate" class="panel">Checking admin access…</div><div id="app" class="hidden"><section class="welcome"><div><small>PRIVATE CONTROL CENTER</small><h1>INKORA Admin</h1><p>Manage stories, covers and chapters from your phone.</p></div><button id="newNovel" class="gold">＋ New story</button></section><div class="stats"><div><small>Published</small><b id="statPublished">0</b></div><div><small>Total stories</small><b id="statNovels">0</b></div><div><small>Chapters</small><b id="statChapters">0</b></div><div><small>Views</small><b id="statViews">0</b></div></div><section class="grid"><form id="novelForm" class="panel"><h2 id="formTitle">Add a story</h2><label>Title<input id="title" required></label><label>Author<input id="author" placeholder="Author name"></label><label>Genre<select id="genre"></select></label><label>Status<select id="status"><option value="ongoing">Ongoing</option><option value="completed">Completed</option><option value="hiatus">Hiatus</option></select></label><label>Synopsis<textarea id="synopsis" rows="5"></textarea></label><label>Chapter count<input id="chapterCount" type="number" min="0" value="0"></label><label>Cover image<input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div class="checks"><label><input id="featured" type="checkbox"> Featured</label><label><input id="trending" type="checkbox"> Trending</label><label><input id="published" type="checkbox" checked> Published</label></div><div class="actions"><button type="submit" class="gold">Save story</button><button type="button" id="cancel" class="ghost hidden">Cancel</button></div><p id="formMsg"></p></form><section class="panel"><div class="head"><h2>Stories</h2><input id="storySearch" placeholder="Search stories"></div><div id="storyList"></div></section></section><section class="panel chapters-panel"><div class="head"><div><h2 id="chapterHeading">Chapters</h2><p id="chapterHint">Select a story to manage chapters.</p></div><button id="closeChapters" class="ghost">Clear</button></div><form id="chapterForm" class="chapter-form hidden"><input id="chapterId" type="hidden"><input id="chapterNumber" type="number" min="1" placeholder="Chapter #" required><input id="chapterTitle" placeholder="Chapter title" required><textarea id="chapterContent" rows="10" placeholder="Write chapter content here…" required></textarea><label><input id="chapterPublished" type="checkbox" checked> Published</label><div class="actions"><button class="gold" type="submit">Save chapter</button><button type="button" id="cancelChapter" class="ghost">Cancel</button></div></form><div id="chapterList" class="chapter-list"></div></section></div></main><script src="admin.js"></script></body></html>
