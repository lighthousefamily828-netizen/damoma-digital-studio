<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — INKORA</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#332614 0,transparent 35%),#09080b;color:#f7f2ea;font-family:"DM Sans",sans-serif;display:grid;place-items:center;padding:24px}.auth{width:min(460px,100%);padding:36px;background:rgba(18,16,22,.94);border:1px solid #302b34;border-radius:22px;box-shadow:0 30px 80px #000}.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.12em}.mark{width:38px;height:38px;border:1px solid #c8a45b;border-radius:11px;display:grid;place-items:center;color:#d9b66b;font:700 22px "Playfair Display"}.kicker{display:block;margin-top:45px;color:#d4b36c;font-size:11px;letter-spacing:.2em;font-weight:800}.auth h1{font:800 42px/1 "Playfair Display";margin:12px 0}.auth p{color:#96909a;line-height:1.7}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button{flex:1;padding:12px;border-radius:8px;border:1px solid #332e37;background:#121016;color:#aaa;cursor:pointer}.tabs button.active{background:#d2ad63;color:#151216;border-color:#d2ad63;font-weight:800}label{display:block;color:#aaa;font-size:12px;margin:14px 0 7px}input{width:100%;padding:14px;border-radius:8px;border:1px solid #38333c;background:#0d0c10;color:#fff;outline:none}button.submit{width:100%;padding:15px;margin-top:18px;border:0;border-radius:8px;background:#d2ad63;color:#151216;font-weight:800;cursor:pointer}.back{display:block;text-align:center;margin-top:18px;color:#d4b36c;text-decoration:none;font-size:13px}.status{min-height:20px;margin-top:12px;color:#d4b36c;font-size:13px}.signed{padding-top:20px}.signed a,.signed button{display:block;width:100%;text-align:center;padding:14px;border-radius:8px;margin-top:10px;text-decoration:none}.signed a{background:#d2ad63;color:#151216;font-weight:800}.signed button{border:1px solid #38333c;background:#141218;color:#eee}</style></head><body><main class="auth"><a class="logo" href="novel.html"><span class="mark">I</span><span>INKORA</span></a><span class="kicker">YOUR READING ACCOUNT</span><h1 id="heading">Welcome back.</h1><p id="sub">Sign in to save stories, continue reading and keep your library across devices.</p><div id="formArea"><div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="signupTab">Create account</button></div><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"><button class="submit" id="submit">Sign in</button><div class="status" id="status"></div></div><a class="back" href="novel.html">← Continue browsing INKORA</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabase=window.supabase.createClient("https://iuwmdwbdkegyzkppvngw.supabase.co","sb_publishable_tXm0KC_lp8lSMh0QkdpCxA_jG_sm1hq");let mode="login";const $=id=>document.getElementById(id);
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");function setMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("signupTab").classList.toggle("active",m==="signup");$("heading").textContent=m==="login"?"Welcome back.":"Join INKORA."; $("sub").textContent=m==="login"?"Sign in to save stories, continue reading and keep your library across devices.":"Create a free account and build your personal reading library.";$("submit").textContent=m==="login"?"Sign in":"Create account";$("status").textContent=""}
async function run(){const email=$("email").value.trim().toLowerCase(),password=$("password").value;if(!email||password.length<6){$("status").textContent="Enter a valid email and a password of at least 6 characters.";return}$("submit").disabled=true;$("status").textContent=mode==="login"?"Signing in…":"Creating account…";try{if(mode==="login"){const r=await supabase.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.href="novel.html"}else{const r=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+"/novel.html"}});if(r.error)throw r.error;$("status").textContent=r.data.session?"Account created. Opening INKORA…":"Account created. Check your email to confirm, then sign in."}}catch(e){$("status").textContent=e.message||"Something went wrong."}finally{$("submit").disabled=false}}
$("submit").onclick=run;supabase.auth.getUser().then(async({data})=>{if(!data.user)return;const {data:p}=await supabase.from("profiles").select("role").eq("id",data.user.id).maybeSingle();$("formArea").innerHTML='<div class="signed"><p>You are already signed in as <b>'+data.user.email+'</b>.</p>'+(p?.role==="admin"?'<a href="admin.html">Open Admin Dashboard →</a>':'<a href="library.html">Open My Library →</a>')+'<button id="signout">Sign out</button></div>';document.getElementById("signout").onclick=async()=>{await supabase.auth.signOut();location.reload()}});</script></body></html>
